stages:
  - build
  - publish
  - verify

variables:
  S3_ENDPOINT: "http://host.docker.internal:4566"
  S3_BUCKET: "notes-frontend-bucket"
  VITE_REDIRECT_URI: "http://localhost:4566/notes-frontend-bucket/callback.html"

build-frontend:
  stage: build
  tags: [dind]
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build -- --base=./
    - cp dist/index.html dist/callback.html
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  cache:
    key: "node-modules-$CI_COMMIT_REF_SLUG"
    paths:
      - frontend/node_modules/

publish-frontend:
  stage: publish
  tags: [dind]
  image: alpine:latest
  needs: ["build-frontend"]
  before_script:
    - apk add --no-cache curl bash
  script:
    - bash frontend/publish_from_artifact.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify-publish:
  stage: verify
  tags: [dind]
  image: alpine:latest
  needs: ["publish-frontend"]
  before_script:
    - apk add --no-cache curl bash
  script:
    - echo "=== Проверка заголовков index.html ==="
    - curl -sI "$S3_ENDPOINT/$S3_BUCKET/index.html" | grep -Ei "^(HTTP|Content-Type|Content-Disposition)"
    - echo "=== Проверка callback.html ==="
    - curl -sI "$S3_ENDPOINT/$S3_BUCKET/callback.html" | grep -Ei "^(HTTP|Content-Type|Content-Disposition)"